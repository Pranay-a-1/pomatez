name: Build Linux Feature

on:
  push:
    branches-ignore:
      - master
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: "yarn"

      - name: Install dependencies
        run: |
          yarn install --immutable --network-timeout 120000

      - name: Build
        run: |
          yarn build
          yarn lerna run build:linux-x64 --stream

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pomatez-Linux-x64
          path: |
            app/electron/dist/*.AppImage
            app/electron/dist/*.deb
